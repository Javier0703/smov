name: Compilar APK Android

on:
  workflow_dispatch: # Permite lanzarlo manualmente cuando quieras con un botón
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK (Release)
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: BrujulaQuest-Tablet-APK
          path: build/app/outputs/flutter-apk/app-release.apk